<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>東京・関東 デート候補カタログ</title>
<meta name="description" content="__DESC__">
<meta property="og:type" content="website">
<meta property="og:title" content="東京・関東 デート候補カタログ">
<meta property="og:description" content="__DESC__">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#d9485f">
<style>
:root{--pri:#d9485f;--pri2:#fdecef;--bg:#f7f4f2;--card:#fff;--tx:#222;--sub:#6b6b6b;--line:#e8e2de}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.97);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px 12px 8px;padding-top:max(10px,env(safe-area-inset-top))}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
h1{font-size:17px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upd{font-size:11px;color:var(--sub);white-space:nowrap}
#tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 0 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#tabs::-webkit-scrollbar{display:none}
#tabs button{flex:none;border:1px solid var(--line);background:#fff;color:var(--tx);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
#tabs button .k{color:var(--sub);font-size:11px;margin-left:3px}
#tabs button.on{background:var(--pri);border-color:var(--pri);color:#fff}
#tabs button.on .k{color:#ffe}
.row{display:flex;gap:6px;margin-top:2px}
.row input,.row select{flex:1;min-width:0;height:36px;padding:0 10px;font-size:15px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--tx)}
.row select{flex:0 0 34%}
.chips{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;color:var(--tx)}
.chip[aria-pressed=true]{background:var(--pri2);border-color:var(--pri);color:var(--pri);font-weight:600}
.chip.rand{background:var(--tx);color:#fff;border-color:var(--tx)}
#cnt{margin-left:auto;font-size:12px;color:var(--sub)}
@media(max-width:420px){h1{font-size:15px}.upd{font-size:10px}}
main{padding:10px 12px 40px;display:grid;gap:10px;grid-template-columns:1fr;max-width:1200px;margin:0 auto}
@media(min-width:700px){main{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1050px){main{grid-template-columns:repeat(3,1fr)}header{padding-left:max(12px,calc((100% - 1176px)/2));padding-right:max(12px,calc((100% - 1176px)/2))}}
.c{background:var(--card);border-radius:14px;padding:12px 12px 10px;box-shadow:0 1px 3px rgba(0,0,0,.06);position:relative;border:2px solid transparent;scroll-margin-top:190px}
.c.t{border-left:4px solid #f0a020}
.c.hl{border-color:var(--pri);animation:pop .6s}
@keyframes pop{0%{transform:scale(.97)}60%{transform:scale(1.02)}100%{transform:scale(1)}}
.n{font-weight:700;font-size:15px;line-height:1.35;padding-right:38px}
.a{font-size:12px;color:var(--sub);margin-top:3px}
.g{display:inline-block;font-size:11px;background:var(--pri2);color:var(--pri);padding:1px 7px;border-radius:999px;margin-left:4px}
.d{font-size:13.5px;line-height:1.5;margin-top:6px}
.p{font-size:12.5px;color:#a24a00;margin-top:6px;font-weight:600}
.p .now,.p .soon,.p .end{display:inline-block;white-space:nowrap;color:#fff;font-size:11px;padding:1px 6px;border-radius:6px;margin-left:4px;font-weight:600}
.p .now{background:#1f9d55}.p .soon{background:#2b6cd4}.p .end{background:#888}
.c.ended{opacity:.55}
.v{font-size:12.5px;margin-top:5px;line-height:1.45}
.f{font-size:11px;color:#999;margin-top:3px;line-height:1.4}
.links{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.links a{font-size:13px;text-decoration:none;color:var(--pri);border:1px solid var(--line);border-radius:8px;padding:5px 10px;background:#fff}
.star{position:absolute;top:8px;right:8px;width:36px;height:36px;border:0;background:none;font-size:22px;cursor:pointer;color:#ccc;line-height:1}
.star.on{color:#f5b400}
.empty{grid-column:1/-1;text-align:center;color:var(--sub);padding:40px 0;font-size:14px}
footer{text-align:center;font-size:11px;color:var(--sub);padding:0 12px 30px;line-height:1.6}
</style>
</head>
<body>
<header>
  <div class="top"><h1>💕 東京・関東 デート候補カタログ</h1><span class="upd">最終更新 __UPDATED__</span></div>
  <nav id="tabs" aria-label="ジャンル"></nav>
  <div class="row">
    <input id="q" type="search" placeholder="検索(名前・説明・エリア)" aria-label="検索">
    <select id="ar" aria-label="エリア"></select>
  </div>
  <div class="chips">
    <button class="chip" id="fFav" aria-pressed="false">★ お気に入り</button>
    <button class="chip" id="fNow" aria-pressed="false">🟢 今やっている</button>
    <button class="chip" id="fSoon" aria-pressed="false">🔜 これから</button>
    <button class="chip" id="fEnd" aria-pressed="false">終了も表示</button>
    <button class="chip rand" id="rand">🎲 ランダム</button>
    <span id="cnt" aria-live="polite"></span>
  </div>
</header>
<main id="list"></main>
<footer>「今やっている」「これから」は会期(開始日〜終了日)が年付きで記載されたものだけが対象です。会期が終わったものは自動で非表示になります(「終了も表示」で確認できます)。会期・営業状況は変わることがあるので、出かける前に公式サイトで確認してください。<br>お気に入りはこの端末のブラウザに保存されます。</footer>
<script>
(function(){
"use strict";
var D=__DATA__;
D.forEach(function(d,i){d._id=i;});
var FKEY="dateSpotsFav_v1";
var favs={};try{favs=JSON.parse(localStorage.getItem(FKEY)||"{}")||{};}catch(e){favs={};}
function saveFav(){try{localStorage.setItem(FKEY,JSON.stringify(favs));}catch(e){}}
function favKey(d){return d.genre+"|"+d.name;}
var GENRES=["話題","すべて"].concat(Array.from(new Set(D.map(function(d){return d.genre;}))).filter(function(g){return g!=="話題";}));
var PREFS=["神奈川県","埼玉県","千葉県","栃木県","群馬県","茨城県","山梨県","静岡県","長野県"];
function pref(a){for(var i=0;i<PREFS.length;i++){if(a.indexOf(PREFS[i])===0)return PREFS[i];}return "東京都";}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
// 会期: 「YYYY年M月D日〜[YYYY年][M月]D日」「YYYY年M月D日・D日」形式のみ解釈。年が無いもの・開業日のみは対象外
var RE=/(\d{4})年(\d{1,2})月(\d{1,2})日\s*(?:〜|～|・)\s*(?:(\d{4})年)?(?:(\d{1,2})月)?(\d{1,2})日/;
function range(p){var m=RE.exec(p||"");if(!m)return null;var y1=+m[1],m1=+m[2],d1=+m[3];var m2=m[5]?+m[5]:m1,d2=+m[6];var y2=m[4]?+m[4]:y1;
  var s=new Date(y1,m1-1,d1),e=new Date(y2,m2-1,d2,23,59,59);if(!m[4]&&e<s)e=new Date(y1+1,m2-1,d2,23,59,59);return [s,e];}
D.forEach(function(d){d._r=range(d.period);});
function isNow(d,t){t=t||new Date();return !!(d._r&&d._r[0]<=t&&t<=d._r[1]);}
function isSoon(d,t){t=t||new Date();return !!(d._r&&t<d._r[0]);}
function isEnded(d,t){t=t||new Date();return !!(d._r&&t>d._r[1]);}
function daysTo(a,t){var x=new Date(a.getFullYear(),a.getMonth(),a.getDate()),y=new Date(t.getFullYear(),t.getMonth(),t.getDate());return Math.round((x-y)/864e5);}
var st={g:"話題",q:"",a:"",fav:false,now:false,soon:false,ended:false};
function readHash(){var h=location.hash.replace(/^#/,"");var p=new URLSearchParams(h);
  var g=p.get("g");st.g=(g&&GENRES.indexOf(g)>=0)?g:"話題";st.q=p.get("q")||"";st.a=p.get("a")||"";st.fav=p.get("fav")==="1";st.now=p.get("now")==="1";st.soon=!st.now&&p.get("soon")==="1";st.ended=p.get("ended")==="1";}
function writeHash(){var p=new URLSearchParams();if(st.g!=="話題")p.set("g",st.g);if(st.q)p.set("q",st.q);if(st.a)p.set("a",st.a);if(st.fav)p.set("fav","1");if(st.now)p.set("now","1");if(st.soon)p.set("soon","1");if(st.ended)p.set("ended","1");
  var s=p.toString();var url=location.pathname+location.search+(s?"#"+s:"");if(url!==location.pathname+location.search+location.hash)history.replaceState(null,"",url);}
var $=function(id){return document.getElementById(id);};
var tabs=$("tabs"),list=$("list"),q=$("q"),ar=$("ar"),fFav=$("fFav"),fNow=$("fNow"),fSoon=$("fSoon"),fEnd=$("fEnd"),cnt=$("cnt");
ar.innerHTML='<option value="">全エリア</option>'+Array.from(new Set(D.map(function(d){return pref(d.area);}))).map(function(p){return '<option>'+esc(p)+'</option>';}).join("");
function base(ignoreGenre){var kw=st.q.trim().toLowerCase(),t=new Date();
  return D.filter(function(d){return (ignoreGenre||st.g==="すべて"||d.genre===st.g)&&(!st.a||pref(d.area)===st.a)&&(!kw||(d.name+" "+d.desc+" "+d.area+" "+d.period+" "+(d.venue||"")).toLowerCase().indexOf(kw)>=0)&&(!st.fav||favs[favKey(d)])&&(!st.now||isNow(d,t))&&(!st.soon||isSoon(d,t))&&(st.ended||!isEnded(d,t));});}
function renderTabs(){var all=base(true),c={};all.forEach(function(d){c[d.genre]=(c[d.genre]||0)+1;});
  tabs.innerHTML=GENRES.map(function(g){var k=g==="すべて"?all.length:(c[g]||0);return '<button type="button" data-g="'+esc(g)+'" class="'+(g===st.g?"on":"")+'">'+(g==="話題"?"🔥最新の話題":esc(g))+'<span class="k">'+k+'</span></button>';}).join("");
  var on=tabs.querySelector(".on");if(on&&on.scrollIntoView)on.scrollIntoView({block:"nearest",inline:"nearest"});}
function mapUrl(d){return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(d.name+" "+d.area);}
function card(d,t){var f=!!favs[favKey(d)];
  return '<article class="c'+(d.trending?" t":"")+(isEnded(d,t)?" ended":"")+'" id="s'+d._id+'" data-id="'+d._id+'">'+
  '<button type="button" class="star'+(f?" on":"")+'" data-fav="'+d._id+'" aria-label="お気に入り" aria-pressed="'+f+'">'+(f?"★":"☆")+'</button>'+
  '<div class="n">'+esc(d.name)+'</div><div class="a">📍'+esc(d.area)+'<span class="g">'+esc(d.genre)+'</span></div>'+
  '<div class="d">'+esc(d.desc)+'</div>'+
  (d.period?'<div class="p">🗓 '+esc(d.period)+(isNow(d,t)?'<span class="now">開催中</span>':isSoon(d,t)?'<span class="soon">これから(あと'+daysTo(d._r[0],t)+'日)</span>':isEnded(d,t)?'<span class="end">終了</span>':'')+'</div>':'')+
  (d.venue?'<div class="v">🏛 '+esc(d.venue)+'</div>':'')+
  (d.reservation?'<div class="v">🎟 '+esc(d.reservation)+'</div>':'')+
  (d.period_note?'<div class="f">※'+esc(d.period_note)+'</div>':'')+
  '<div class="links">'+(d.url?'<a href="'+esc(d.url)+'" target="_blank" rel="noopener">公式サイト↗</a>':'')+'<a href="'+esc(mapUrl(d))+'" target="_blank" rel="noopener">🗺 Googleマップ</a></div>'+
  (d.url&&d.url_status==="blocked"?'<div class="f">※公式URLは検索で確認済み(ページ内容は未確認)</div>':'')+
  '</article>';}
var cur=[];
function render(){cur=base(false);var t=new Date();
  cnt.textContent=cur.length+"件 / 全"+D.length+"件";
  list.innerHTML=cur.length?cur.map(function(d){return card(d,t);}).join(""):'<div class="empty">条件に合うスポットがありません</div>';
  renderTabs();fFav.setAttribute("aria-pressed",st.fav);fNow.setAttribute("aria-pressed",st.now);fSoon.setAttribute("aria-pressed",st.soon);fEnd.setAttribute("aria-pressed",st.ended);
  if(q.value!==st.q)q.value=st.q;ar.value=st.a;writeHash();}
tabs.addEventListener("click",function(e){var b=e.target.closest("button[data-g]");if(!b)return;st.g=b.getAttribute("data-g");render();window.scrollTo(0,0);});
q.addEventListener("input",function(){st.q=q.value;render();});
ar.addEventListener("change",function(){st.a=ar.value;render();});
fFav.addEventListener("click",function(){st.fav=!st.fav;render();});
fNow.addEventListener("click",function(){st.now=!st.now;if(st.now)st.soon=false;render();});
fSoon.addEventListener("click",function(){st.soon=!st.soon;if(st.soon)st.now=false;render();});
fEnd.addEventListener("click",function(){st.ended=!st.ended;render();});
list.addEventListener("click",function(e){var b=e.target.closest("button[data-fav]");if(!b)return;var d=D[+b.getAttribute("data-fav")],k=favKey(d);
  if(favs[k])delete favs[k];else favs[k]=1;saveFav();
  if(st.fav){render();return;}var f=!!favs[k];b.classList.toggle("on",f);b.textContent=f?"★":"☆";b.setAttribute("aria-pressed",f);});
$("rand").addEventListener("click",function(){if(!cur.length)return;var d=cur[Math.floor(Math.random()*cur.length)];
  var prev=list.querySelector(".hl");if(prev)prev.classList.remove("hl");var el=$("s"+d._id);if(!el)return;el.classList.add("hl");el.scrollIntoView({behavior:"smooth",block:"center"});});
window.addEventListener("hashchange",function(){readHash();render();});
readHash();render();
})();
</script>
</body>
</html>
